# Arma el sitio con scripts/generar.js y lo sube a Cloudflare Pages (Direct Upload con wrangler):
# - en cada push a main;
# - cuando se guarda un auto en el panel (Supabase dispara workflow_dispatch);
# - cada 15 minutos, solo si cambiaron los autos (respaldo, y mantiene activo el proyecto de Supabase).
# Secrets del repo: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Sin cancelar: si no, un chequeo programado podría cortar la publicación de un push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fotos ya bajadas en publicaciones anteriores (no cambian nunca): solo se bajan las nuevas.
      - uses: actions/cache/restore@v6
        with:
          path: .cache/fotos
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-
      - id: generar
        run: node scripts/generar.js
        env:
          SOLO_SI_CAMBIO: ${{ github.event_name == 'schedule' && '1' || '' }}
      - if: steps.generar.outputs.cambio == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/fotos
          key: fotos-${{ hashFiles('.cache/fotos/**') }}
      - name: Subir a Cloudflare Pages
        if: steps.generar.outputs.cambio == 'true'
        run: npx --yes wrangler@4.151.1 pages deploy _site --project-name punto-carrasco --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub apaga los workflows programados de repos públicos a los 60 días sin commits; esto lo mantiene vivo.
      - name: Mantener activa la publicación automática
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publicar.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
